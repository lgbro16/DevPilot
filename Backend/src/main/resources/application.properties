spring.application.name=Backend
# Defaults match docker-compose.yml (postgres on host port 5433)
spring.datasource.url=${DB_url:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI Configuration (Google GenAI Gemini)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID:devpilot}
spring.ai.google.genai.embedding.project-id=${GOOGLE_PROJECT_ID:devpilot}
spring.ai.google.genai.embedding.location=${GOOGLE_LOCATION:us-central1}
spring.ai.google.genai.chat.model=${GOOGLE_MODEL:gemini-2.5-flash-lite}
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=1536
spring.ai.google.genai.embedding.text.options.dimensions=1536
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.main.allow-bean-definition-overriding=true

# App Rate Limiting & Embedding
app.gemini.rate-limit-rpm=${GEMINI_RATE_LIMIT_RPM:60}
app.embedding.validate-on-startup=true

# App Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-secret-token-key-password}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:5c0744940b5c369b}
app.github.api-delay-ms=${GITHUB_API_DELAY_MS:50}
app.indexing.max-file-bytes=${INDEXING_MAX_FILE_BYTES:102400}
app.indexing.chunk-size=${INDEXING_CHUNK_SIZE:800}

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your_github_client_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your_github_client_secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
